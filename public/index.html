            --header-height: 56px;
            --decorative-color: #5E8C87;
            --bg-opacity: 1;
            --font-color: #1A1A1A;
            --bg-image: none;

            /* 卡片微染青绿色背景 */
            --card-bg: rgba(215, 230, 219, 0.25);
            --card-bg-solid: #FAFCFB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-main);
            color: var(--font-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== 遮罩层 ========== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* ========== 侧边导航栏 ========== */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--nav-width);
            background: linear-gradient(180deg, #5E8C87 0%, #2E6A67 55%, #204A47 100%);
            z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }
        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar-header {
            background: linear-gradient(135deg, #5E8C87 0%, #2E6A67 100%);
            padding: 20px 18px 16px;
            color: white;
        }
        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .sidebar-header p {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 4px;
        }

        .nav-list {
            flex: 1;
            padding: 12px 0;
            overflow-y: auto;
        }
        .nav-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            gap: 14px;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(241, 240, 232, 0.12);
            border-left-color: var(--decorative-color);
        }
        .nav-item.active {
            background: rgba(241, 240, 232, 0.20);
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .nav-text {
            font-size: 15px;
            font-weight: 500;
            color: #EAF1EE;
        }
        .nav-item.active .nav-text {
            color: #FFFFFF;
            font-weight: 600;
        }

        /* 子菜单 */
        .sub-nav {
            padding-left: 38px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .sub-nav.expanded {
            max-height: 200px;
        }
        .sub-nav-item {
            padding: 10px 20px 10px 0;
            font-size: 13.5px;
            color: rgba(234, 241, 238, 0.75);
            cursor: pointer;
            transition: color 0.2s;
        }
        .sub-nav-item:hover, .sub-nav-item.active {
            color: #FFFFFF;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(241, 240, 232, 0.15);
            text-align: center;
            font-size: 11px;
            color: rgba(234, 241, 238, 0.55);
        }

        /* ========== 主内容区 ========== */
        .main-content {
            min-height: 100vh;
            transition: filter 0.3s ease;
        }
        .main-content.blurred {
            filter: blur(3px);
        }

        /* ========== 顶部栏 ========== */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(241, 240, 232, calc(var(--bg-opacity) * 0.98)), rgba(241, 240, 232, calc(var(--bg-opacity) * 0.95)));
            border-bottom: 1px solid #D7E6DB;
            padding: 0 16px;
            height: var(--header-height);
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
        }
        .menu-btn {
            width: 36px;
            height: 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .menu-btn:hover {
            background: rgba(46, 106, 103, 0.08);
        }
        .menu-btn span {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .menu-btn.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .menu-btn.active span:nth-child(2) { opacity: 0; }
        .menu-btn.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        .page-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }
        .date-display {
            font-size: 12px;
            color: var(--text-light);
            white-space: nowrap;
        }
        .top-bar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .updated-text {
            font-size: 10.5px;
            color: var(--text-light);
            white-space: nowrap;
            max-width: 110px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .refresh-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: rgba(46, 106, 103, 0.08);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s, transform 0.4s;
        }
        .refresh-btn svg { width: 17px; height: 17px; }
        .refresh-btn:active { transform: scale(0.92); }
        .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
        @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

        /* ========== 页面容器 ========== */
        .page {
            display: none;
            padding: 16px;
            padding-bottom: 80px;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 日期模块标题 ========== */
        .date-section {
            margin-bottom: 20px;
        }
        .date-section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .date-section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--decorative-color);
            border-radius: 2px;
        }
        .date-section-title h2 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* ========== 卡片样式（宋瓷青绿风格） ========== */
        .card {
            background: linear-gradient(135deg, #FAFCFB 0%, rgba(215, 230, 219, 0.18) 100%);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid #D7E6DB;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(46, 106, 103, 0.15);
            border-color: #A9C8BE;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .card-title {
            font-size: 15.5px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
            flex: 1;
            padding-right: 10px;
        }
        .card-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .badge-national { background: #E8F5E9; color: #2E7D32; }
        .badge-provincial { background: #E3F2FD; color: #1565C0; }
        .badge-city { background: #FFF3E0; color: #E65100; }
        .badge-pending { background: #F5F5F5; color: #757575; }
        .badge-recruit { background: #E8F0FE; color: #1967D2; }
        .badge-bianzhi { background: #E8F5E9; color: #2E7D32; }
        .badge-condition { background: #FFF8E1; color: #F57F17; }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .meta-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            background: rgba(169, 200, 190, 0.25);
            border-radius: 6px;
            font-size: 11.5px;
            color: #2E6A67;
        }
        .meta-tag svg {
            width: 13px;
            height: 13px;
        }

        .card-desc {
            font-size: 13.5px;
            line-height: 1.65;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .tag {
            padding: 3px 10px;
            background: rgba(169, 200, 190, 0.30);
            border-radius: 15px;
            font-size: 11.5px;
            color: #2E6A67;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary-color);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            padding: 6px 0;
        }
        .card-link:hover {
            text-decoration: underline;
        }
        .card-link svg {
            width: 14px;
            height: 14px;
        }

        /* ========== 标签切换 ========== */
        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            background: var(--bg-card);
            padding: 5px;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }
        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .tab-btn.active {
            background: #5E8C87;
            color: white;
            box-shadow: 0 2px 8px rgba(94, 140, 135, 0.30);
        }

        /* ========== 换色设置页（宋瓷青绿风格） ========== */
        .settings-section {
            background: linear-gradient(135deg, #FAFCFB 0%, rgba(215, 230, 219, 0.15) 100%);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            border: 1px solid #D7E6DB;
        }
        .settings-section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15.5px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        .settings-section-title svg {
            width: 20px;
            height: 20px;
            color: var(--primary-color);
        }

        /* 调色板 */
        .color-palette {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 14px;
        }
        .color-swatch {
            aspect-ratio: 1;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s ease;
            position: relative;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        .color-swatch.selected {
            border-color: var(--text-primary);
            box-shadow: 0 0 0 2px white, 0 0 0 4px var(--text-primary);
        }
        .custom-color-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: rgba(215, 230, 219, 0.20);
            border-radius: 8px;
            margin-top: 8px;
        }
        .custom-color-preview {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            flex-shrink: 0;
        }
        .custom-color-info {
            flex: 1;
        }
        .custom-color-label {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .custom-color-value {
            font-size: 14px;
            font-weight: 600;
            font-family: monospace;
            color: var(--text-primary);
        }
        .color-input-hidden {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* 滑块 */
        .slider-container {
            padding: 8px 0;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .slider-label span {
            font-size: 13.5px;
            color: var(--text-secondary);
        }
        .slider-value {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 14px;
        }
        input[type=range] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #E0E0E0;
            outline: none;
            -webkit-appearance: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #5E8C87;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(46,106,103,0.25);
        }

        /* 背景图片上传 */
        .bg-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .bg-upload-area:hover {
            border-color: #A9C8BE;
            background: rgba(169, 200, 190, 0.06);
        }
        .bg-upload-area.has-image {
            padding: 10px;
            border-style: solid;
        }
        .bg-upload-area img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            object-fit: cover;
        }
        .upload-placeholder {
            color: var(--text-light);
            font-size: 14px;
        }
        .upload-placeholder svg {
            width: 40px;
            height: 40px;
            margin-bottom: 8px;
            color: var(--primary-color);
            opacity: 0.5;
        }
        .clear-bg-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .bg-upload-area.has-image .clear-bg-btn {
            display: flex;
        }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 12px;
            opacity: 0.4;
        }
        .empty-state p {
            font-size: 14px;
        }

        /* ========== 复制按钮 ========== */
        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 11.5px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background: rgba(169, 200, 190, 0.35);
            color: #2E6A67;
            border-color: #A9C8BE;
        }
        .copy-btn.copied {
            background: #E8F5E9;
            color: #2E7D32;
            border-color: #2E7D32;
        }

        /* ========== Toast提示 ========== */
        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(46, 106, 103, 0.94);
            color: white;
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 13.5px;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* ========== 响应式 ========== */
        @media (min-width: 768px) {
            .page {
                max-width: 640px;
                margin: 0 auto;
            }
            .sidebar {
                transform: translateX(-100%);
            }
        }

        @media (max-width: 374px) {
            .page { padding: 12px; padding-bottom: 70px; }
            .card { padding: 14px; }
            .color-palette { grid-template-columns: repeat(4, 1fr); gap: 10px; }
        }

        /* ========== 背景图片效果 ========== */
        .bg-image-layer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .bg-image-layer.active {
            opacity: var(--bg-opacity);
        }

        /* ========== 信息来源标签 ========== */
        .source-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11.5px;
            color: var(--text-light);
            margin-top: 8px;
        }
        .source-tag svg {
            width: 12px;
            height: 12px;
        }

        /* ========== 展开收起 ========== */
        .expandable-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .expandable-header::after {
            content: '›';
            font-size: 18px;
            transition: transform 0.3s;
            color: var(--text-light);
        }
        .expandable-header.expanded::after {
            transform: rotate(90deg);
        }

        /* ========== 歌曲卡片特殊样式 ========== */
        .song-artist {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .song-original {
            font-weight: 600;
            color: var(--primary-color);
        }
        .song-copy-box {
            background: rgba(215, 230, 219, 0.20);
            border: 1px solid #D7E6DB;
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            position: relative;
        }
        .song-copy-content {
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-primary);
            word-break: break-all;
        }
        .copy-action {
            position: absolute;
            top: 8px;
            right: 8px;
        }

        /* ========== 招聘详情信息行 ========== */
        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .info-row svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            margin-top: 2px;
            color: var(--primary-color);
        }
        .info-label {
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .info-value {
            color: var(--text-primary);
            flex: 1;
        }
    </style>
</head>
<body>

<!-- 背景图片层 -->
<div class="bg-image-layer" id="bgImageLayer"></div>

<!-- 遮罩 -->
<div class="overlay" id="overlay"></div>

<!-- 侧边导航栏 -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h1>🎨 飞鱼丸的工作台</h1>
        <p>国画 · 考编 · 翻唱</p>
    </div>
    <nav class="nav-list">
        <div class="nav-item active" data-page="exhibition" onclick="switchPage('exhibition')">
            <span class="nav-icon">🖼️</span>
            <span class="nav-text">投展投展！</span>
        </div>
        <div class="nav-item" data-page="exam" id="examNav" onclick="toggleExamSub()">
            <span class="nav-icon">📚</span>
            <span class="nav-text">考编考编！</span>
        </div>
        <div class="sub-nav" id="examSubNav">
            <div class="sub-nav-item active" data-page="exam-xian" onclick="switchPage('exam-xian')">西安考编</div>
            <div class="sub-nav-item" data-page="exam-shenyang" onclick="switchPage('exam-shenyang')">沈阳考编</div>
        </div>
        <div class="nav-item" data-page="douyin" onclick="switchPage('douyin')">
            <span class="nav-icon">🎵</span>
            <span class="nav-text">抖音抖音！</span>
        </div>
        <div class="nav-item" data-page="settings" onclick="switchPage('settings')">
            <span class="nav-icon">🎨</span>
            <span class="nav-text">换色换色！</span>
        </div>
    </nav>
    <div class="sidebar-footer">飞鱼丸的工作台 v1.0</div>
</aside>

<!-- 主内容区 -->
<main class="main-content" id="mainContent">

    <!-- 顶部栏 -->
    <header class="top-bar">
        <div class="menu-btn" id="menuBtn" onclick="toggleSidebar()">
            <span></span><span></span><span></span>
        </div>
        <h1 class="page-title" id="pageTitle">投展投展！</h1>

<!-- Toast提示 -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// 全局状态管理
// ============================================================
const AppState = {
    currentPage: 'exhibition',
    settings: {
        decorativeColor: '#5E8C87',
        bgOpacity: 100,
        fontColor: '#1A1A1A',
        bgImageData: null
    },
    data: {
        exhibitions: [],
        xianJobs: [],
        shenyangJobs: [],
        douyinHot: []
    }
};

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    loadSettings();
    applySettings();
    initColorPalettes();
    updateDateDisplay();

    // ★ 每次打开都优先用共享数据（data.js / 内联兜底），确保页面永远有内容
    const sd = getShared();
    if (sd && hasData(sd)) {
        applySharedData(sd);
    } else {
        // 共享数据不可用时才读本地缓存
        loadAllData();
        // 本地也为空则用内置种子
        if (!hasData(AppState.data)) {
            initSampleData();
        }
    }
    saveAllData(); // 持久化到本地

    renderAllPages();
    showUpdatedTime();

    // 后台尝试拉取更新的共享数据（不阻塞界面）
    syncFromBackend(false);
});

// 判断数据对象是否含有效条目
function hasData(d) {
    return d && (Array.isArray(d.exhibitions) || Array.isArray(d.xianJobs) ||
                 Array.isArray(d.shenyangJobs) || Array.isArray(d.douyinHot));
}

// 获取共享数据：data.js 优先，其次内联兜底
function getShared() {
    return window.SHARED_DATA && hasData(window.SHARED_DATA)
        ? window.SHARED_DATA
        : (window.SHARED_DATA_FALLBACK || null);
}

// 把共享数据规范后写入 AppState
function applySharedData(d) {
    AppState.data = Object.assign(AppState.data, {
        exhibitions: Array.isArray(d.exhibitions) ? d.exhibitions : [],
        xianJobs: Array.isArray(d.xianJobs) ? d.xianJobs : [],
        shenyangJobs: Array.isArray(d.shenyangJobs) ? d.shenyangJobs : [],
        douyinHot: Array.isArray(d.douyinHot) ? d.douyinHot : []
    });
    if (d.meta && d.meta.updatedAt) AppState.data.updatedAt = d.meta.updatedAt;
}

// ============================================================
// ============================================================
// 每日数据自动更新：从 jsDelivr CDN 拉取最新 data.js
// 数据流：每日09:00 自动化 git push → Gitee →(镜像)→ GitHub → jsDelivr(带CORS) → 本页面
// jsDelivr 对浏览器开放 CORS、国内可访问、网址固定，彻底解决 Gitee raw 在浏览器端被限流/拦截的问题。
// 加载失败时回退到本页内置数据（部署时快照），页面永远不会空白。
// ============================================================
const CDN_DATA_URLS = [
    'https://cdn.jsdelivr.net/gh/fyw566/FYW@main/public/data.js',
    'https://fastly.jsdelivr.net/gh/fyw566/FYW@main/public/data.js',
    'https://gcore.jsdelivr.net/gh/fyw566/FYW@main/public/data.js'
];

function syncFromBackend(manual) {
    const btn = document.getElementById('refreshBtn');
    if (manual && btn) btn.classList.add('spinning');
    loadFromCDN(manual, function () {
        if (manual) showToast('暂未能获取最新数据，显示本地数据');
        if (btn) setTimeout(function () { btn.classList.remove('spinning'); }, 400);
    });
}

// 依次尝试各 CDN 镜像加载最新 data.js（脚本注入方式不受 CORS 限制，且 jsDelivr 本身带 CORS 头）
function loadFromCDN(manual, onAllFailed) {
    let i = 0;
    function tryNext() {
        if (i >= CDN_DATA_URLS.length) {
            if (onAllFailed) onAllFailed();
            return;
        }
        const url = CDN_DATA_URLS[i++] + '?_=' + Date.now();
        const sc = document.createElement('script');
        sc.src = url;
        sc.onload = function () {
            const d = window.SHARED_DATA;
            if (d && hasData(d)) {
                applySharedData(d);
                saveAllData();
                renderAllPages();
                showUpdatedTime();
                if (manual) showToast('已更新到最新数据');
            } else {
                tryNext();
            }
        };
        sc.onerror = tryNext;
        document.head.appendChild(sc);
    }
    tryNext();
}

function showUpdatedTime() {
    const el = document.getElementById('updatedText');
    if (!el) return;
    const t = AppState.data.updatedAt;
    if (!t) { el.textContent = ''; return; }
    try {
        const d = new Date(t);
        const pad = n => String(n).padStart(2, '0');
        el.textContent = `更新 ${d.getMonth() + 1}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    } catch (e) {
        el.textContent = '';
    }
}

// ============================================================
// 日期显示
// ============================================================
function updateDateDisplay() {
    const now = new Date();
    const dateStr = `${now.getFullYear()}年${String(now.getMonth() + 1).padStart(2, '0')}月${String(now.getDate()).padStart(2, '0')}日`;
    document.getElementById('dateDisplay').textContent = dateStr;

    document.getElementById('exhibitionDateTitle').textContent = `${dateStr} 展览信息`;
    document.getElementById('xianDateTitle').textContent = `${dateStr} 西安岗位`;
    document.getElementById('shenyangDateTitle').textContent = `${dateStr} 沈阳岗位`;
    document.getElementById('douyinDateTitle').textContent = `${dateStr} 翻唱热点`;
}

// ============================================================
// 导航与页面切换
// ============================================================
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuBtn = document.getElementById('menuBtn');
    const mainContent = document.getElementById('mainContent');

    sidebar.classList.toggle('active');
    overlay.classList.toggle('active');
    menuBtn.classList.toggle('active');
    mainContent.classList.toggle('blurred');
}

function closeSidebar() {
    document.getElementById('sidebar').classList.remove('active');
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('menuBtn').classList.remove('active');
    document.getElementById('mainContent').classList.remove('blurred');
}

document.getElementById('overlay').addEventListener('click', closeSidebar);

const pageTitles = {
    'exhibition': '投展投展！',
    'exam-xian': '考编考编！·西安考编',
    'exam-shenyang': '考编考编！·沈阳考编',
    'douyin': '抖音抖音！',
    'settings': '换色换色！'
};

function switchPage(pageId) {
    // 更新页面显示
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const targetPage = document.getElementById(`page-${pageId}`);
    if (targetPage) targetPage.classList.add('active');

    // 更新标题
    document.getElementById('pageTitle').textContent = pageTitles[pageId] || '';

    // 更新导航状态
    updateNavState(pageId);

    // 关闭侧边栏
    closeSidebar();

    AppState.currentPage = pageId;
}

function updateNavState(pageId) {
    // 更新导航项激活状态
    document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
        const itemPage = item.dataset.page;
        if (itemPage === pageId || 
            (pageId.startsWith('exam-') && itemPage === 'exam')) {
            item.classList.add('active');
        }
    });

    // 更新子导航状态
    document.querySelectorAll('.sub-nav-item').forEach(item => {
        item.classList.remove('active');
        if (item.dataset.page === pageId) {
            item.classList.add('active');
        }
    });

    // 考编子菜单展开
    if (pageId.startsWith('exam-')) {
        document.getElementById('examSubNav').classList.add('expanded');
    } else {
        document.getElementById('examSubNav').classList.remove('expanded');
    }
}

function toggleExamSub() {
    const subNav = document.getElementById('examSubNav');
    subNav.classList.toggle('expanded');
    // 默认进入西安考编
    if (subNav.classList.contains('expanded')) {
        switchPage('exam-xian');
    }
}

function switchExamTab(city, btn) {
    if (city === 'xian') {
        switchPage('exam-xian');
    } else {
        switchPage('exam-shenyang');
    }
    // 更新当前页面的tab按钮状态
    const pageId = city === 'xian' ? 'page-exam-xian' : 'page-exam-shenyang';
    document.querySelectorAll(`#${pageId} .tab-btn`).forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
}

// ============================================================
// 设置相关
// ============================================================
function loadSettings() {
    const saved = localStorage.getItem('workbench_settings');
    if (saved) {
        Object.assign(AppState.settings, JSON.parse(saved));
    }
}

function saveSettings() {
    localStorage.setItem('workbench_settings', JSON.stringify(AppState.settings));
}

function applySettings() {
    const s = AppState.settings;
    document.documentElement.style.setProperty('--decorative-color', s.decorativeColor);
    document.documentElement.style.setProperty('--bg-opacity', s.bgOpacity / 100);
    document.documentElement.style.setProperty('--font-color', s.fontColor);

    // 背景图片
    const bgLayer = document.getElementById('bgImageLayer');
    if (s.bgImageData) {
        bgLayer.style.backgroundImage = `url(${s.bgImageData})`;
        bgLayer.classList.add('active');
        document.getElementById('bgPreviewImg').src = s.bgImageData;
        document.getElementById('bgPreviewImg').style.display = 'block';
        document.getElementById('bgUploadPlaceholder').style.display = 'none';
        document.getElementById('bgUploadArea').classList.add('has-image');
    }

    // 恢复滑块值
    document.getElementById('opacitySlider').value = s.bgOpacity;
    document.getElementById('opacityValue').textContent = s.bgOpacity + '%';

    // 恢复自定义颜色预览
    document.getElementById('customDecorPreview').style.background = s.decorativeColor;
    document.getElementById('customDecorValue').textContent = s.decorativeColor;
    document.getElementById('customDecorInput').value = s.decorativeColor;
    document.getElementById('customFontPreview').style.background = s.fontColor;
    document.getElementById('customFontValue').textContent = s.fontColor;
    document.getElementById('customFontInput').value = s.fontColor;
}

// 装饰色调色板（宋瓷青绿系为主）
const decorColors = [
    '#5E8C87', '#2E6A67', '#A9C8BE', '#D7E6DB',
    '#E74C3C', '#27AE60', '#F39C12', '#9B59B6',
    '#16A085', '#34495E'
];

// 字体颜色选项
const fontColors = [
    '#1A1A1A', '#2C2C2C', '#555555', '#3B8B87', '#9B59B6'
];

function initColorPalettes() {
    // 装饰色
    const decorPalette = document.getElementById('decorColorPalette');
    decorColors.forEach(color => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch' + (color === AppState.settings.decorativeColor ? ' selected' : '');
        swatch.style.background = color;
        swatch.onclick = () => selectDecorColor(color, swatch);
        decorPalette.appendChild(swatch);
    });

    // 自定义装饰色输入
    document.getElementById('customDecorInput').oninput = function(e) {
        selectDecorColor(e.target.value.toUpperCase(), null);
    };
    document.querySelector('#page-settings .custom-color-row').onclick = function(e) {
        if (e.target.tagName !== 'INPUT') {
            document.getElementById('customDecorInput').click();
        }
    };

    // 字体颜色
    const fontPalette = document.getElementById('fontColorPalette');
    fontColors.forEach(color => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch' + (color === AppState.settings.fontColor ? ' selected' : '');
        swatch.style.background = color;
        swatch.onclick = () => selectFontColor(color, swatch);
        fontPalette.appendChild(swatch);
    });

    // 自定义字体颜色输入
    document.getElementById('customFontInput').oninput = function(e) {
        selectFontColor(e.target.value.toUpperCase(), null);
    };
    document.querySelectorAll('#page-settings .custom-color-row')[1].onclick = function(e) {
        if (e.target.tagName !== 'INPUT') {
            document.getElementById('customFontInput').click();
        }
    };
}

function selectDecorColor(color, swatch) {
    AppState.settings.decorativeColor = color;
    document.documentElement.style.setProperty('--decorative-color', color);
    document.getElementById('customDecorPreview').style.background = color;
    document.getElementById('customDecorValue').textContent = color;
    document.getElementById('customDecorInput').value = color;

    document.querySelectorAll('#decorColorPalette .color-swatch').forEach(s => s.classList.remove('selected'));
    if (swatch) swatch.classList.add('selected');

    saveSettings();
    showToast('装饰色已更新');
}

function selectFontColor(color, swatch) {
    AppState.settings.fontColor = color;
    document.documentElement.style.setProperty('--font-color', color);
    document.getElementById('customFontPreview').style.background = color;
    document.getElementById('customFontValue').textContent = color;
    document.getElementById('customFontInput').value = color;

    document.querySelectorAll('#fontColorPalette .color-swatch').forEach(s => s.classList.remove('selected'));
    if (swatch) swatch.classList.add('selected');

    saveSettings();
    showToast('字体颜色已更新');
}

function updateOpacity(value) {
    AppState.settings.bgOpacity = parseInt(value);
    document.documentElement.style.setProperty('--bg-opacity', value / 100);
    document.getElementById('opacityValue').textContent = value + '%';
    saveSettings();
}

function handleBgUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const dataUrl = e.target.result;
        AppState.settings.bgImageData = dataUrl;

        document.getElementById('bgImageLayer').style.backgroundImage = `url(${dataUrl})`;
        document.getElementById('bgImageLayer').classList.add('active');
        document.getElementById('bgPreviewImg').src = dataUrl;
        document.getElementById('bgPreviewImg').style.display = 'block';
        document.getElementById('bgUploadPlaceholder').style.display = 'none';
        document.getElementById('bgUploadArea').classList.add('has-image');

        saveSettings();
        showToast('背景图片已设置');
    };
    reader.readAsDataURL(file);
}

function clearBgImage() {
    AppState.settings.bgImageData = null;
    document.getElementById('bgImageLayer').style.backgroundImage = '';
    document.getElementById('bgImageLayer').classList.remove('active');
    document.getElementById('bgPreviewImg').style.display = 'none';
    document.getElementById('bgPreviewImg').src = '';
    document.getElementById('bgUploadPlaceholder').style.display = 'block';
    document.getElementById('bgUploadArea').classList.remove('has-image');
    document.getElementById('bgImageInput').value = '';
    saveSettings();
    showToast('背景图片已清除');
}

// ============================================================
// 数据存储与加载
// ============================================================
function loadAllData() {
    const saved = localStorage.getItem('workbench_data');
    if (saved) {
        Object.assign(AppState.data, JSON.parse(saved));
    }
}

function saveAllData() {
    localStorage.setItem('workbench_data', JSON.stringify(AppState.data));
}

// ============================================================
// 渲染函数
// ============================================================
function renderAllPages() {
    renderExhibitions();
    renderXianJobs();
    renderShenyangJobs();
    renderDouyin();
}

// ---- 投展列表 ----
function renderExhibitions() {
    const container = document.getElementById('exhibitionList');
    const items = AppState.data.exhibitions;

    if (!items || items.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                <p>暂无展览信息<br>每日早上9点自动更新</p>
            </div>`;
        return;
    }

    container.innerHTML = items.map(item => `
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">${item.title}</h3>
                <span class="card-badge ${getLevelBadgeClass(item.level)}">${item.level || '待定'}</span>
            </div>
            <div class="card-meta">
                ${item.deadline ? `<span class="meta-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${item.deadline}</span>` : ''}
                ${item.location ? `<span class="meta-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${item.location}</span>` : ''}

// ============================================================
// 工具函数
// ============================================================
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
}

function copyText(elementId, btn) {
    const text = document.getElementById(elementId).textContent;
    navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '已复制 ✓';
        btn.classList.add('copied');
        setTimeout(() => {
            btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> 复制';
            btn.classList.remove('copied');
        }, 1800);
        showToast('文案已复制到剪贴板');
    }).catch(() => {
        showToast('复制失败，请手动选择复制');
    });
}
